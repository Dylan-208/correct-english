# Serviços locais das camadas opcionais:
#   libretranslate -> tradução para português (ADR 0005)
#   languagetool   -> gramática, camada L1     (ADR 0006)
#
#   docker compose up -d          sobe os dois
#   docker compose logs -f        acompanha (a primeira subida baixa imagens e modelos)
#   docker compose down           desliga
#
# O app funciona sem qualquer um dos dois, e cada ausência degrada só a si mesma. Nenhuma
# configuração do app precisa mudar: a disponibilidade é testada a cada chamada, então
# subir ou descer um contêiner tem efeito imediato, sem reiniciar o Correct English.

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: correct-english-translator
    restart: unless-stopped
    ports:
      - "5000:5000"

    # Deliberadamente mínimo. A primeira versão deste arquivo passava também
    # LT_DISABLE_WEB_UI e LT_UPDATE_MODELS, e o contêiner entrava em loop de reinício
    # com "gunicorn: error: argument -w/--workers: expected one argument" -- o entrypoint
    # monta a linha de comando do gunicorn a partir do ambiente, e variáveis booleanas
    # com valor textual quebram esse parsing. Não acrescente variável aqui sem checar
    # o log depois.
    environment:
      # Carrega só o par inglês/português em vez de ~50 idiomas. Corta o download de
      # alguns GB para algumas centenas de MB, e o uso de RAM na mesma proporção.
      LT_LOAD_ONLY: "en,pt"

    # Sem volume nomeado, de propósito. Montar um volume em
    # /home/libretranslate/.local/share/argos-translate faz o contêiner morrer com
    # PermissionError: o volume nasce pertencendo ao root e o processo roda como usuário
    # sem privilégio. Os modelos ficam na camada de escrita do próprio contêiner, então
    # sobrevivem a "restart" e a reinício da máquina -- só são baixados de novo depois de
    # um "docker compose down". Para uma dependência opcional de uso pessoal, é a troca
    # certa: menos partes móveis do que acertar permissão de volume.

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: correct-english-grammar
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      # Teto de heap explícito. O padrão da imagem é generoso, e numa máquina de 16 GB
      # que também roda o LibreTranslate vale limitar. 1 GB é suficiente sem n-gramas.
      Java_Xms: "384m"
      Java_Xmx: "1g"

      # Sem os dados de n-grama, de propósito: são vários GB e servem principalmente para
      # pares confundíveis (their/there, its/it's). Se essa classe de erro se mostrar
      # frequente no uso real, baixar os n-gramas é a primeira coisa a reconsiderar --
      # ver ADR 0006.
